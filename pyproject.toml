[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-ai-research"
version = "0.1.0"
description = "Multi-agent AI deep research assistant built with LangGraph, FAISS, Tavily, and Streamlit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "langchain",
    "langchain-community",
    "langchain-openai",
    "langchain-text-splitters",
    "langgraph",
    "faiss-cpu",
    "tavily-python",
    "python-dotenv",
    "PyYAML",
    "pydantic",
    "pypdf",
    "beautifulsoup4",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"deep_researcher.config" = [".env.example", "concepts.json", "system_prompts.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
